<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>StealthRDP Windows Demo Sandbox</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0;background:#05070b;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:18px}
    .shell{width:min(1107px,calc(100vw - 36px));aspect-ratio:1107/623;overflow:hidden;border:1px solid #263243;border-radius:12px;background:#000;box-shadow:0 24px 80px rgba(0,0,0,.45)}
    .viewport{position:relative;width:100%;height:100%;overflow:hidden}
    iframe{position:absolute;left:0;top:0;width:1107px;height:623px;border:0;transform-origin:0 0;background:#000}
  </style>
</head>
<body>
  <main class="shell" id="shell">
    <div class="viewport">
      <iframe id="demo" src="/api/win11-preview?path=/" width="1107" height="623" title="StealthRDP Windows interactive demo"></iframe>
    </div>
  </main>
  <script>
    (()=>{
      const shell=document.getElementById('shell');
      const frame=document.getElementById('demo');
      const resize=()=>{frame.style.transform=`scale(${shell.clientWidth/1107})`};
      resize();
      if('ResizeObserver' in window)new ResizeObserver(resize).observe(shell);else addEventListener('resize',resize,{passive:true});
    })();
  </script>
</body>
</html>
