<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family:'Space Grotesk'; src:url('file:///opt/data/stealthrdp-v2/fonts/space-grotesk_700.woff2') format('woff2'); font-weight:700; }
  @font-face { font-family:'Inter'; src:url('file:///opt/data/stealthrdp-v2/fonts/inter_400.woff2') format('woff2'); font-weight:400; }
  @font-face { font-family:'Inter'; src:url('file:///opt/data/stealthrdp-v2/fonts/inter_600.woff2') format('woff2'); font-weight:600; }
  @font-face { font-family:'JetBrains Mono'; src:url('file:///opt/data/stealthrdp-v2/fonts/jetbrains-mono_400.woff2') format('woff2'); font-weight:400; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse 70% 60% at 80% 110%, rgba(91,140,255,0.14), transparent 60%),
      radial-gradient(ellipse 50% 50% at 10% -10%, rgba(47,212,124,0.05), transparent 55%),
      linear-gradient(160deg, #0c0e13 0%, #08090c 55%, #0a0b10 100%);
    font-family:'Inter',system-ui,sans-serif;
    color:#eaeef5;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:52px 60px 44px;
  }
  .top { display:flex; align-items:center; gap:14px; }
  .logo-mark { width:40px; height:40px; border-radius:10px; background:rgba(91,140,255,0.12); border:1px solid rgba(91,140,255,0.35); display:grid; place-items:center; }
  .logo-mark svg { width:22px; height:22px; stroke:#5b8cff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .wordmark { font-family:'Space Grotesk'; font-weight:700; font-size:26px; letter-spacing:-0.01em; }
  .wordmark em { font-style:normal; color:#5b8cff; }
  .eyebrow { font-family:'JetBrains Mono'; font-size:15px; letter-spacing:0.14em; text-transform:uppercase; color:#5b8cff; display:flex; align-items:center; gap:10px; }
  .eyebrow::before { content:""; width:7px; height:7px; border-radius:50%; background:#5b8cff; box-shadow:0 0 10px rgba(91,140,255,0.6); }
  .headline { font-family:'Space Grotesk'; font-weight:700; font-size:64px; line-height:1.06; letter-spacing:-0.025em; max-width:820px; margin-top:18px; }
  .headline .gold { background:linear-gradient(100deg,#7aa5ff,#5b8cff 45%,#3f6fe0); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-size:22px; color:#98a3b4; margin-top:18px; max-width:700px; line-height:1.45; }
  .bottom { display:flex; align-items:flex-end; justify-content:space-between; }
  .stats { display:flex; gap:34px; }
  .stat .num { font-family:'Space Grotesk'; font-weight:700; font-size:30px; letter-spacing:-0.02em; }
  .stat .num .plus { color:#5b8cff; }
  .stat .lbl { font-family:'JetBrains Mono'; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#5f6a7d; margin-top:4px; }
  .url { font-family:'JetBrains Mono'; font-size:17px; color:#5f6a7d; }
  .url b { color:#eaeef5; font-weight:400; }
  .console-chip { display:inline-flex; align-items:center; gap:9px; border:1px solid #2b3547; background:rgba(16,19,26,0.85); border-radius:10px; padding:10px 16px; font-family:'JetBrains Mono'; font-size:14px; color:#98a3b4; }
  .console-chip .dot { width:8px; height:8px; border-radius:50%; background:#2fd47c; box-shadow:0 0 9px rgba(47,212,124,0.8); }
  .grid-lines { position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,0.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.022) 1px,transparent 1px); background-size:60px 60px; pointer-events:none; }
</style>
</head>
<body>
  <div class="grid-lines"></div>
  <div>
    <div class="top">
      <span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg></span>
      <span class="wordmark">Stealth<em>RDP</em></span>
    </div>
    <div style="margin-top:56px">
      <span class="eyebrow">Windows &amp; Linux VPS · Instant Setup</span>
      <h1 class="headline">Your server. <span class="gold">Live in 60 seconds.</span></h1>
      <p class="sub">Enterprise-grade remote desktop infrastructure with NVMe storage, DDoS protection, and 24/7 support.</p>
    </div>
  </div>
  <div class="bottom">
    <div class="stats">
      <div class="stat"><div class="num">10,000<span class="plus">+</span></div><div class="lbl">Orders</div></div>
      <div class="stat"><div class="num">60<span class="plus">s</span></div><div class="lbl">Avg deploy</div></div>
      <div class="stat"><div class="num">99.9<span class="plus">%</span></div><div class="lbl">Uptime SLA</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:18px">
      <span class="console-chip"><span class="dot"></span>All systems monitored</span>
      <span class="url"><b>stealthrdp.com</b></span>
    </div>
  </div>
</body>
</html>
