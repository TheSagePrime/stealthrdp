<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>StealthRDP — Direction Boards</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10151b;color:#eef2f5;font-family:Inter,Arial,sans-serif}
h1{font-family:SpaceGrotesk,Arial,sans-serif;font-weight:500;font-size:26px;letter-spacing:-.02em;margin:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 28px;border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;background:#10151b;z-index:5}
.head .sub{color:#8fa0b0;font-size:13px}
.board-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;height:calc(100vh - 75px)}
.board{display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.1)}
.board:last-child{border-right:0}
.board-label{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.1);background:#141b24}
.board-label b{font-size:13px;letter-spacing:.02em}
.board-label span{color:#8fa0b0;font-size:11px;font-family:JetBrains,monospace;letter-spacing:.08em;text-transform:uppercase}
.board-label a{color:#e8b35a;font-size:12px;text-decoration:none}
iframe{flex:1;width:100%;border:0}
@media (max-width:1100px){.board-grid{grid-template-columns:1fr;height:auto}.board{height:100vh;border-right:0;border-bottom:1px solid rgba(255,255,255,.1)}}
</style>
</head>
<body>
<div class="head">

</html>
