<svg width="960" height="600" viewBox="0 0 960 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">StealthRDP remote workspace concept illustration</title>
  <desc id="desc">An original illustration of a remote workspace connected to Windows and Linux server rails. It is a concept diagram, not live monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="55" y1="24" x2="890" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172131"/>
      <stop offset="0.56" stop-color="#0D141F"/>
      <stop offset="1" stop-color="#080C13"/>
    </linearGradient>
    <linearGradient id="screen" x1="206" y1="105" x2="697" y2="405" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26364A"/>
      <stop offset="1" stop-color="#111A27"/>
    </linearGradient>
    <linearGradient id="gold" x1="170" y1="150" x2="778" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4C96D"/>
      <stop offset="1" stop-color="#B8862E"/>
    </linearGradient>
    <filter id="shadow" x="78" y="38" width="808" height="530" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#02050A" flood-opacity="0.72"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#A6B5C8" stroke-opacity="0.08"/>
    </pattern>
  </defs>

