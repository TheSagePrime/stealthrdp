name: SEO gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Deployed preview URL to crawl"
        required: false
        type: string
      live_url:
        description: "Published live URL to verify"
        required: false
        type: string

permissions:
  contents: read

jobs:
  pre-pr:
    name: Pre-PR SEO and build checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run application tests
        run: npm test
      - name: Run strict SEO and AI-discovery gates
        run: npm run seo:check
      - name: Validate SEO publish packages (publish gate)
        run: |
          # Publish gate per article-publishing-contract.md ("Headless publishing gate"):
          # validate every staged *.seo-package.json BEFORE anything is published.
          # Exit 1 from the validator means: publish NOTHING (fail closed).
          # Zero packages found = nothing staged, gate passes cleanly.
          set -u
          rc=0
          found=0
          while IFS= read -r -d '' pkg; do
            found=1
            python3 /opt/data/workflows/seo/validate_publish_package.py --package "$pkg" --publish-root "$GITHUB_WORKSPACE" || rc=1
          done < <(find . -name '*.seo-package.json' -not -path './node_modules/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No *.seo-package.json packages found - gate passes (nothing staged)."
          fi
          exit "$rc"
      - name: Build site
        run: npm run build

  preview:
    name: Preview SEO crawl
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_url != '' }}
    runs-on: ubuntu-latest
    needs: pre-pr
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Crawl deployed preview
        run: node scripts/check-preview.mjs "${{ inputs.preview_url }}"

  live:
    name: Published SEO verification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify published URL
        run: node scripts/check-live.mjs "${{ inputs.live_url }}"
