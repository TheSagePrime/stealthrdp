name: SEO gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Deployed preview URL to crawl"
        required: false
        type: string

permissions:
  contents: read

jobs:
  pre-pr:
    name: Pre-PR SEO and build checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run application tests
        run: npm test
      - name: Run strict SEO gates
        run: npm run seo:check
      - name: Build site
        run: npm run build

  preview:
    name: Preview SEO crawl
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_url != '' }}
    runs-on: ubuntu-latest
    needs: pre-pr
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Crawl deployed preview
        run: node scripts/check-preview.mjs "${{ inputs.preview_url }}"
